services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CACHE_BUST: "2026-03-31-v2.6-return-feeds-whep-pool"
    container_name: virtual-audience-app-v2-6
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/virtual_audience
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=virtual_audience
      - SESSION_SECRET=virtual-audience-production-secret-change-in-production
      # SRS Server Configuration - Separate WHIP/WHEP/Studio server support
      - SRS_WHIP_HOST=${SRS_WHIP_HOST:-}
      - SRS_WHIP_PORT=${SRS_WHIP_PORT:-1990}
      - SRS_WHIP_USE_HTTPS=${SRS_WHIP_USE_HTTPS:-true}
      - SRS_WHIP_API_PORT=${SRS_WHIP_API_PORT:-1985}
      - SRS_WHIP_API_USE_HTTPS=${SRS_WHIP_API_USE_HTTPS:-false}
      - SRS_WHEP_HOST=${SRS_WHEP_HOST:-}
      - SRS_WHEP_PORT=${SRS_WHEP_PORT:-}
      - SRS_WHEP_USE_HTTPS=${SRS_WHEP_USE_HTTPS:-}
      - SRS_WHEP_API_PORT=${SRS_WHEP_API_PORT:-}
      - SRS_WHEP_API_USE_HTTPS=${SRS_WHEP_API_USE_HTTPS:-}
      - SRS_API_HOST=${SRS_API_HOST:-}
      - SRS_API_PORT=${SRS_API_PORT:-}
      - SRS_API_USE_HTTPS=${SRS_API_USE_HTTPS:-}
      # Studio server (return feed playback) - falls back to WHEP settings if not set
      - SRS_STUDIO_HOST=${SRS_STUDIO_HOST:-}
      - SRS_STUDIO_PORT=${SRS_STUDIO_PORT:-}
      - SRS_STUDIO_USE_HTTPS=${SRS_STUDIO_USE_HTTPS:-}
      - SRS_STUDIO_API_PORT=${SRS_STUDIO_API_PORT:-}
      - SRS_STUDIO_API_USE_HTTPS=${SRS_STUDIO_API_USE_HTTPS:-}
      # Multi-server WHIP load balancing (comma-separated host:port list)
      - SRS_WHIP_SERVERS=${SRS_WHIP_SERVERS:-}
      # Legacy configuration for backward compatibility
      - SRS_HOST=${SRS_HOST:-}
      - SRS_USE_HTTPS=${SRS_USE_HTTPS:-}
      # Email Configuration
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-alerts@obedtv.com}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - virtual-audience-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: virtual-audience-db-v2-6
    restart: unless-stopped
    environment:
      - POSTGRES_DB=virtual_audience
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - virtual-audience-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtual_audience"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  virtual-audience-network:
    driver: bridge
